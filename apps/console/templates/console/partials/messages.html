{% if messages %}
<ul class="space-y-1">
  {% for message in messages %}
  <li role="status" class="rounded-xl border px-3 py-2 {% if message.level_tag == 'error' %}border-red-300 bg-red-50 text-red-800{% elif message.level_tag == 'warning' %}border-amber-300 bg-amber-50 text-amber-900{% elif message.level_tag == 'success' %}border-lime-300 bg-brand-soft text-brand-dark{% else %}border-slate-200 bg-white text-slate-700{% endif %}">{{ message }}</li>
  {% endfor %}
</ul>
{% endif %}
