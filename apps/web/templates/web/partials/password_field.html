{% load i18n %}
{# Collage permis, et bouton « Afficher » : sur un telephone, un mot de passe qu'on ne voit pas se tape mal, et le client retourne au code SMS. #}
<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="password-row">
    {{ field }}
    <button type="button" class="secondary" data-reveal="{{ field.id_for_label }}" aria-pressed="false"
            data-show="{% translate 'Afficher' %}" data-hide="{% translate 'Masquer' %}">{% translate "Afficher" %}</button>
  </div>
  {% if help %}<p class="help">{{ help }}</p>{% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
